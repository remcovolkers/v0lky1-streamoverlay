<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>v0lky1 Stream Overlay</title>
  <!-- Google TTS weigert aanvragen met een localhost/github.io-referrer (404 in plaats van audio) -->
  <meta name="referrer" content="no-referrer">

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cam.css">
  <link rel="stylesheet" href="css/nowplaying.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/alerts.css">
</head>
<body>
  <div class="cam">
    <div class="ring b"></div>
    <div class="ring"></div>
    <div class="ring in"></div>
    <div class="lbl"><i></i>v0lky1</div>
  </div>

  <div class="np" id="np">
    <div class="eq"><i></i><i></i><i></i></div>
    <div class="np-body">
      <div class="np-k">Now playing</div>
      <div class="np-wrap" id="np-wrap"><span class="np-text" id="np-text"></span></div>
    </div>
  </div>

  <div class="alert" id="alert"></div>

  <section class="chat">
    <div class="side">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"></circle><path d="M2 20c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 010 7M18 14c2.5.6 4 2.6 4 6"></path></svg><small id="cc">0</small>
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-6 5V5z"></path></svg><small id="mc">0</small>
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="5" ry="9" transform="rotate(20 12 12)"></ellipse></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg>
      <svg class="dn" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6M5 20h14"></path></svg>
    </div>
    <div class="tabs"><div class="tab">Den Chat</div></div>
    <div class="msgs" id="msgs"></div>
  </section>

  <p id="status" class="status"></p>
  <div class="ctl" id="ctl"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
